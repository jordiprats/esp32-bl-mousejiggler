[env:esp32-c3-zero]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; --- USE THIS OFFICIAL LIBRARY ID ---
lib_deps =
    T-vK/ESP32 BLE Mouse@^0.3.1  ; Use the correct registry ID

build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1